# Slots for Feedbacks
slots:
  session_id:
    type: text
    initial_value: null
    mappings: []

  user_id:
    type: text
    initial_value: null
    mappings: []

  username:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: username

  roles:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: roles

  last_question:
    type: text
    initial_value: ""
    influence_conversation: false
    mappings:
      - type: custom

  last_last_question:
    type: text
    influence_conversation: false
    initial_value: ""
    mappings:
      - type: custom

  last_answer:
    type: text
    initial_value: ""
    influence_conversation: false
    mappings:
      - type: custom

  last_last_answer:
    type: text
    initial_value: ""
    influence_conversation: false
    mappings:
      - type: custom

  predicted_intent:
    type: text
    initial_value: ""
    influence_conversation: false
    mappings:
      - type: custom

  full_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: full_name

  id_candidat:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: id_candidat

  sscomp:
    type: categorical # Les slots catégoriques sont souvent considérés comme des "caractéristiques" du dialogue.
    values:
      - supp_peda
      - prod_rdi
      - doss
      - test_qcm
      - pres_doss
      - diss_jury
      - eval_pres_se
      - eval_se
      - eval_pres_ptp
      - eval_ptp
      - qcm_all
      - caps_peda_all
      - diss_all
      - seq_ens_all
      - plat_tp_all
      - prod_peda_all
      - entr_jury_all
      - first_comp
      - second_comp
      - third_comp
    influence_conversation: false # Ceci indique que la valeur du slot ne doit pas influencer le prochain état du dialogue.
    mappings:
      - type: from_entity
        entity: sscomp
        conditions:
          - active_loop: null # Le slot est rempli dès qu'une entité sscomp est vue.

  language:
    type: categorical
    values:
      - fr
      - en
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: language
        conditions:
          - active_loop: null

  keyword:
    type: categorical
    values:
      - mdp
      - id
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: keyword
        conditions:
          - active_loop: null  # Only extract outside forms

  grade:
    type: categorical
    values:
      - professeur_tech
      - assistant_tech
      - maitre_tech
      - tech
      - efa
      - efs
      - efm
      - ef
      - elcc2
      - elcc1
      - elcc
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: grade
        conditions:
          - active_loop: null  # Only extract outside forms

  session:
    type: categorical
    values:
      - session_24-25
      - session_25-26
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: session
        conditions:
          - active_loop: null  # Only extract outside forms

  speciality:
    type: categorical
    values:
      - gc
      - elct_mkn
      - tic
      - ged
      - math
      - lcom
    influence_conversation: false
