# Project identification
sonar.projectKey=my-rasa-bot
sonar.projectName=My Rasa Assistant
sonar.projectVersion=1.0

# Path to source code (usually your actions folder and custom modules)
# We exclude 'tests' from the main source analysis
sonar.sources=actions, data

# Path to tests
sonar.tests=tests

# Language specific info
sonar.language=py
sonar.python.version=3.10, 3.11

# Server details
sonar.host.url=http://localhost:9000
# sonar.token=YOUR_GENERATED_TOKEN (Better to pass this via CLI or ENV)

# Exclusions (Avoid scanning heavy Rasa model files or virtual envs)
sonar.exclusions=models/**, .venv/**, venv/**, tests/**