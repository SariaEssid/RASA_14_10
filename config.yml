language: fr
assistant_id: 20250713-185142-convoluted-cap

pipeline:
  - name: WhitespaceTokenizer

  - name: RegexFeaturizer                 # lookup tables from nlu.yml as features

  - name: RegexEntityExtractor            # deterministic extraction from the 7 lookup tables
    case_sensitive: false
    use_lookup_tables: true
    use_regexes: false
    use_word_boundaries: true

  - name: LexicalSyntacticFeaturizer      # word-shape features, helps entity extraction

  - name: CountVectorsFeaturizer          # word-level
  - name: CountVectorsFeaturizer          # char-level
    analyzer: "char_wb"
    min_ngram: 1
    max_ngram: 5

  - name: DIETClassifier                  # intents + entities
    epochs: 300
    constrain_similarities: true
    entity_recognition: true
    learning_rate: 0.001
    dropout: 0.2

  - name: EntitySynonymMapper

  - name: FallbackClassifier              # below 0.6 -> nlu_fallback (handled by the semantic FAISS fallback)
    threshold: 0.6
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
  - name: TEDPolicy                       # generalizes beyond the written stories/rules
    constrain_similarities: true
    max_history: 5
    epochs: 200